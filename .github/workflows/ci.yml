name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: every job gets read-only access only. Individual jobs may
# narrow further, never widen beyond this.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          version: "0.13.6"
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install locked dependencies
        run: uv sync --locked --all-extras --python ${{ matrix.python-version }}
      - name: Lint with ruff (make lint)
        run: uv run --python ${{ matrix.python-version }} ruff check src tests scripts app
      - name: Format check (make format-check)
        run: uv run --python ${{ matrix.python-version }} ruff format --check src tests scripts app
      - name: Type check
        run: uv run --python ${{ matrix.python-version }} mypy src
      - name: Test with pytest
        run: uv run --python ${{ matrix.python-version }} pytest
      - name: CLI smoke test (run)
        run: uv run --python ${{ matrix.python-version }} mosaic run --scenario nominal --seed 1 --duration 0.5 --num-objects 1
      - name: CLI smoke test (evaluate)
        run: |
          uv run --python ${{ matrix.python-version }} mosaic evaluate \
            --scenario nominal --seeds 1 --duration 0.5 --num-objects 1 \
            --output /tmp/mosaic-smoke
      - name: CLI smoke test (compare)
        run: |
          uv run --python ${{ matrix.python-version }} mosaic compare \
            --scenario nominal --seeds 1 --duration 0.5 --num-objects 1 \
            --output /tmp/mosaic-compare
          test -s /tmp/mosaic-compare/benchmark.json
          test -s /tmp/mosaic-compare/per_seed.csv
          test -s /tmp/mosaic-compare/report.md
      - name: CLI smoke test (benchmark, multiple scenarios)
        run: |
          uv run --python ${{ matrix.python-version }} mosaic benchmark \
            --scenario nominal,sensor_disagreement_large_bias,sensor_disagreement_within_gate \
            --seeds 1 --duration 0.5 --num-objects 1 \
            --output /tmp/mosaic-benchmark
          test -s /tmp/mosaic-benchmark/benchmark.json
          test -s /tmp/mosaic-benchmark/per_seed.csv
          test -s /tmp/mosaic-benchmark/report.md
          python3 - <<'PY'
          import json
          names = [s["scenario"]["name"] for s in json.load(open("/tmp/mosaic-benchmark/benchmark.json"))["scenarios"]]
          expected = ["nominal", "sensor_disagreement_large_bias", "sensor_disagreement_within_gate"]
          assert names == expected, names
          PY
      - name: CLI smoke test (benchmark rejects unknown scenario)
        run: |
          if uv run --python ${{ matrix.python-version }} mosaic benchmark \
            --scenario nominal,not_a_scenario --seeds 1 --duration 0.5 \
            --output /tmp/mosaic-benchmark-bad 2> /tmp/mosaic-benchmark-bad.err; then
            echo "benchmark accepted an unknown scenario" >&2
            exit 1
          fi
          grep -q "unknown scenario" /tmp/mosaic-benchmark-bad.err

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Pin the scanner version; bump deliberately, alongside a rescan.
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "${base}/${archive}" -o "${RUNNER_TEMP}/${archive}"
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o "${RUNNER_TEMP}/checksums.txt"
          (cd "${RUNNER_TEMP}" && grep "${archive}" checksums.txt | sha256sum --check --strict -)
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" gitleaks
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - name: Secret scan (full history, includes the tracked tree at HEAD)
        run: gitleaks git . --redact --no-banner

  artifact-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          version: "0.13.6"
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install locked dependencies
        run: uv sync --locked --all-extras --python 3.12
      - name: Artifact provenance (recorded commit, unchanged source, version)
        run: uv run --python 3.12 python scripts/check_artifact_provenance.py
      - name: Golden benchmark (byte-for-byte against committed goldens)
        run: uv run --python 3.12 python scripts/check_benchmark_golden.py
