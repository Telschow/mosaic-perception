name: Docs site

on:
  pull_request:
    branches: [main]
    paths: ["docs/**", "docs-site/**", "scripts/sync_docs_site.py", "CITATION.cff", ".github/workflows/docs.yml"]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Install dependencies
        working-directory: docs-site
        run: npm ci
      - name: npm audit (advisory, does not fail the build)
        working-directory: docs-site
        continue-on-error: true
        run: npm audit --omit=dev
      - name: Build site (fails on any broken internal link)
        working-directory: docs-site
        run: npm run build
      - name: Accessibility check (WCAG2AA, fails on errors)
        working-directory: docs-site
        run: |
          npx astro preview --port 4321 &
          npx wait-on -t 60000 http://localhost:4321/mosaic-perception/
          npm run a11y
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs-site/dist

  deploy:
    # Publishes only from the default branch; the only job with write scopes.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
